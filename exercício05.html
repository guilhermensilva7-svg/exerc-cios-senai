<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caixa de sugestão</title>
</head>
<body>
    <div>
        <header>
            <h2>CyberExpress</h2>
        </header>
        <main>
            <h1>Caixa de sugestões</h1>
            <p>Escreva sua sugestão de melhora para nosso site!</p>
            <form method="post" action="#">
                <textarea name="Deixe suas sugestões" required="yes" style="resize: none;" rows="7"
                cols="50"></textarea>
                <br>
                <button type="submit">enviar sugestão</button>
            </form>
        </main>
    </div>
</body>
</html>
